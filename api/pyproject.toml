[project]
name = "api"
version = "0.1.0"
description = "FPLBud FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fplcore",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "slowapi>=0.1.9",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.12",
]

[project.scripts]
api = "api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
