[project]
name = "fplcore"
version = "0.1.0"
description = "Shared FPL client, metrics, optimiser, agent and explainer"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pulp>=2.9,<3",
    "python-dotenv>=1.0",
    "sentry-sdk>=2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
