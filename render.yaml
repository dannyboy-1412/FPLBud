services:
  - type: web
    name: fplbud-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,https://fplbud.vercel.app
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: LLM_ENABLED
        value: "false"
